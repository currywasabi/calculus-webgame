<title>증명 조각</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* Layout: one printed page — section heading, goal and theorem lines, a dotted 12×8 board, the loose pieces below, controls at the foot */
:root{
  --paper:#fbfbf9;
  --ink:#121212;
  --ink-2:#76756f;
  --rule:#e1e1db;
  --tile:#ffffff;
  --dot:#c9c9c2;
  --serif:"Old Standard TT","Nanum Myeongjo","Times New Roman",serif;
  --kr:"Nanum Myeongjo","Old Standard TT",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#121211;--ink:#ecebe6;--ink-2:#8f8e88;--rule:#2e2e2b;--tile:#1a1a18;--dot:#3d3d39;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#121211;--ink:#ecebe6;--ink-2:#8f8e88;--rule:#2e2e2b;--tile:#1a1a18;--dot:#3d3d39;color-scheme:dark}

html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:40rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1.25rem 2.5rem;display:flex;flex-direction:column;gap:1rem}

.head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:.4rem}
.sec{margin:0;font-family:var(--kr);font-weight:800;font-size:1.15rem}
.sec .num{font-family:var(--serif);font-weight:400;margin-right:.4rem}
.lv{display:flex;gap:2px}
.lv button{font-family:var(--serif);font-size:.95rem;width:1.7rem;height:1.7rem;border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-radius:2px;font-variant-numeric:tabular-nums;text-decoration-thickness:1px;text-underline-offset:3px}
.lv button.done{color:var(--ink);text-decoration:underline}
.lv button[aria-current="true"]{background:var(--ink);color:var(--paper)}

.task{display:flex;flex-direction:column;gap:.35rem}
.goal{display:flex;align-items:center;gap:.8rem;min-height:2.6rem}
.lbl{font-family:var(--kr);font-size:.82rem;color:var(--ink-2);letter-spacing:.08em}
.goal-tex{font-size:1.35rem}
.note{margin:0;font-family:var(--kr);font-size:.95rem;display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.note b{font-weight:800}
.note .t{font-style:italic}
.note .m{font-size:1.05rem}

.bw{display:flex;justify-content:center}
.board{position:relative;box-shadow:0 0 0 1px var(--ink);background-color:var(--paper);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px)}
.board svg.ov{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#sil path{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:2 4}
#sil rect{fill:var(--ink);fill-opacity:.045}
#prev path{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 3}
#prev rect{fill:var(--ink);fill-opacity:.07}
#layer{position:absolute;inset:0}

/* pieces */
.piece{position:relative;flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
.piece.onboard{position:absolute}
.piece svg.shape{position:absolute;left:0;top:0;overflow:visible}
.shape .sh rect{fill:var(--ink)}
.shape .fl rect{fill:var(--tile)}
.shape .ol{fill:none;stroke:var(--ink);stroke-width:1;stroke-linecap:square}
.shape .dr{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.onboard .shape .sh{display:none}
.lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.piece.bad .shape .fl rect{fill:var(--ink)}
.piece.bad{color:var(--paper)}
.piece.bad .shape .dr{stroke:var(--paper)}
.piece.melt{opacity:.1;transform:scale(.93);transition:opacity .4s ease,transform .4s ease}
.piece.flash{animation:flash .9s ease-out}
@keyframes flash{0%,40%{transform:translateY(-4px)}100%{transform:none}}
.ghost{position:fixed!important;left:0!important;top:0!important;z-index:60;pointer-events:none;opacity:.96}
.ghost .shape .sh{display:block!important}

.tray{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 14px;min-height:5.5rem;padding:.6rem 0 .3rem;border-bottom:1px solid var(--rule)}
.tray.shake{animation:shake .35s linear}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.tray-empty{font-family:var(--kr);color:var(--ink-2);font-size:.85rem;align-self:center}

.bar{display:flex;align-items:center;gap:.6rem}
.btn{font-family:var(--kr);font-weight:700;font-size:.95rem;padding:.5rem .9rem;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:2px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.msg{flex:1;min-width:0;font-family:var(--kr);font-size:.92rem;min-height:1.4em}
.eq{font-family:var(--serif);font-size:2rem;line-height:1;width:3.6rem;height:3.2rem;background:var(--ink);color:var(--paper);border:0;border-radius:2px;cursor:pointer;box-shadow:3px 3px 0 var(--ink-2)}
.eq:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink-2)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* derivation */
.deriv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem 1rem 3.2rem;cursor:pointer;overflow:hidden}
.dlines{display:flex;flex-direction:column;align-items:center;gap:.55em;max-width:100%}
.ln{display:flex;align-items:center;gap:.6em;max-width:100%;overflow-x:auto;overflow-y:hidden;animation:lnin .55s ease-out;transition:color .4s,font-size .4s}
.ln.old{color:var(--ink-2);font-size:.8em}
.ln.txt{font-family:var(--kr)}
@keyframes lnin{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.qed{font-size:1.5em;line-height:1;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:none}}
.dctl{position:absolute;right:.7rem;bottom:.7rem}
.dctl .btn{background:var(--paper)}
.dctl .btn:hover{background:var(--ink)}

mjx-container{color:inherit}
mjx-container[display="true"]{margin:0!important}
mjx-assistive-mml{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(1px,1px,1px,1px)!important}
.rawtex{font-family:ui-monospace,monospace;font-size:.75em}

@media (max-width:480px){
  .eq{width:3rem;height:2.8rem;font-size:1.7rem}
  .btn{padding:.45rem .65rem;font-size:.88rem}
  .goal-tex{font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<main class="app" id="app">
  <header class="head">
    <h1 class="sec"><span class="num" id="secnum">§1</span><span id="title"></span></h1>
    <nav class="lv" id="lv" aria-label="문제"></nav>
  </header>

  <section class="task">
    <div class="goal"><span class="lbl">목표</span><div class="goal-tex" id="goal"></div></div>
    <div id="notes"></div>
  </section>

  <div class="bw" id="bw">
    <div class="board" id="board">
      <svg class="ov" id="sil"></svg>
      <div id="layer"></div>
      <svg class="ov" id="prev"></svg>
      <div class="deriv" id="deriv" hidden>
        <div class="dlines" id="dlines"></div>
        <div class="dctl" id="dctl" hidden><button class="btn" id="dbtn">다시</button></div>
      </div>
    </div>
  </div>

  <div class="tray" id="tray"></div>

  <div class="bar">
    <button class="btn" id="hintb">힌트</button>
    <button class="btn" id="resetb">초기화</button>
    <span class="msg" id="msg" aria-live="polite"></span>
    <button class="eq" id="eqb" aria-label="계산">=</button>
  </div>
</main>

$('hintb').addEventListener('click', hint);

/* ---------- drag & drop ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const pe = e.target.closest('.piece');
  if (!pe || S.busy || pe.classList.contains('ghost')) return;
  e.preventDefault();
  const r = pe.getBoundingClientRect();
  drag = { id: pe.dataset.id, el: pe, x0: e.clientX, y0: e.clientY, gx: e.clientX - r.left, gy: e.clientY - r.top, moved: false, snap: null };
});
function snapAt(px, py, cx, cy) {
  const br = el.board.getBoundingClientRect();
  const d = lvl().pieces.find(q => q.id === drag.id);
  const x = Math.round((px - br.left) / cell), y = Math.round((py - br.top) / cell);
  const over = cx >= br.left && cx <= br.right && cy >= br.top && cy <= br.bottom;
  return { x, y, over, valid: canPlace(d, x, y, d.id), d };
}
function showPreview(s) {
  if (!s || !s.valid) { el.prev.innerHTML = ''; return; }
  const { o, f } = edges(absCells(s.d, s.x, s.y), cell);
  el.prev.innerHTML = f + `<path d="${o}"/>`;
}
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
    drag.moved = true;
    const g = drag.el.cloneNode(true);
    g.classList.remove('onboard', 'flash', 'bad');
    g.classList.add('ghost');
    document.body.appendChild(g);
    drag.ghost = g;
    drag.el.style.visibility = 'hidden';
    msg('');
  }
  const px = e.clientX - drag.gx, py = e.clientY - drag.gy;
  drag.ghost.style.transform = `translate(${px}px,${py}px)`;
  drag.snap = snapAt(px, py, e.clientX, e.clientY);
  showPreview(drag.snap);
});
function autoPlace(d) {
  const y0 = Math.max(0, Math.min(ROWS - d.h, 4 - d.axis));
  let start = 1;
  for (const q of lvl().pieces) if (S.place[q.id]) start = Math.max(start, S.place[q.id][0] + q.w);
  for (let x = start; x + d.w <= COLS; x++) if (canPlace(d, x, y0, d.id)) return [x, y0];
  for (let y = 0; y + d.h <= ROWS; y++) for (let x = 0; x + d.w <= COLS; x++) if (canPlace(d, x, y, d.id)) return [x, y];
  return null;
}
function endDrag(apply) {
  if (!drag) return;
  const dr = drag; drag = null;
  el.prev.innerHTML = '';
  if (!dr.moved) {
    if (!apply) return;
    if (S.place[dr.id]) delete S.place[dr.id];
    else { const pos = autoPlace(lvl().pieces.find(q => q.id === dr.id)); if (pos) S.place[dr.id] = pos; }
    msg(''); render(); return;
  }
  dr.ghost.remove();
  dr.el.style.visibility = '';
  const s = dr.snap;
  if (apply && s) {
    if (s.valid) S.place[dr.id] = [s.x, s.y];
    else if (!s.over) delete S.place[dr.id];
  }
  render();
}
window.addEventListener('pointerup', () => endDrag(true));
window.addEventListener('pointercancel', () => endDrag(false));

/* ---------- evaluate ---------- */
function markBad(ids) {
  for (const id of ids) {
    const pe = el.layer.querySelector(`[data-id="${id}"]`);
    if (pe) { pe.classList.add('bad'); setTimeout(() => pe.classList.remove('bad'), 1800); }
  }
}
function placedList() {
  return lvl().pieces.filter(d => S.place[d.id]).map(d => {
    const [x, y] = S.place[d.id];
    return { def: d, left: x, right: x + d.w - 1, top: y, bottom: y + d.h - 1, ax: y + d.axis, area: cellsOf(d).length };
  });
}
const wait = ms => new Promise(res => { if (S.skip) return res(); const t = setTimeout(res, ms); S.cancelWait = () => { clearTimeout(t); res(); }; });
async function solve() {
  if (S.busy) return;
  const L = lvl();
  const list = placedList();
  if (!list.length) { msg('판이 비어 있다.'); return; }
  if (list.length < L.pieces.length) { msg('조각이 남았다.'); el.tray.classList.remove('shake'); void el.tray.offsetWidth; el.tray.classList.add('shake'); return; }
  let ast;
  try { ast = parseRegion(list, { intDepth: 0 }); }
  catch (err) { msg(err && err.msg ? err.msg : '식이 완성되지 않았다.'); if (err && err.ids) markBad(err.ids); return; }

  const goal = C(L.goal[1]);
  let val = null, reason = '';
  try { val = N(ast, {}); if (!isFinite(val.re) || !isFinite(val.im)) { val = null; reason = '정의되지 않는다.'; } }
  catch (e) { reason = e && e.diverge ? '발산한다.' : '정의되지 않는다.'; }
  const tr = trace(ast);
  const lines = tr.lines.map((t, k) => ({ tex: k ? '=' + t : t }));
  if (tr.err) lines.push({ text: '정의되지 않는다.' });
  else if (!nice(tr.final)) lines.push(val ? { tex: '\\approx ' + fmt(val) } : { text: reason });
  const ok = !!val && close(val, goal);
  if (!ok && lines[lines.length - 1].tex) lines[lines.length - 1].tex += '\\;\\neq\\;' + L.goal[0];
  msg('');
  await play(lines, ok);
}
async function play(lines, ok) {
  S.busy = true; S.skip = false;
  const ps = [...el.layer.children].sort((a, b) => a.offsetLeft - b.offsetLeft);
  ps.forEach((p, k) => { p.style.transitionDelay = (k * 60) + 'ms'; p.classList.add('melt'); });
  el.dlines.innerHTML = ''; el.dctl.hidden = true; el.deriv.hidden = false;
  await wait(380 + ps.length * 60);
  for (let k = 0; k < lines.length; k++) {
    const ln = document.createElement('div');
    ln.className = 'ln' + (lines[k].text ? ' txt' : '');
    if (lines[k].text) ln.textContent = lines[k].text; else ln.appendChild(mj(lines[k].tex, true));
    [...el.dlines.children].forEach(c => c.classList.add('old'));
    el.dlines.appendChild(ln);
    while (el.dlines.children.length > 3) el.dlines.firstElementChild.remove();
    if (k < lines.length - 1) await wait(k === 0 ? 1000 : 1100);
  }
  await wait(450);
  if (ok) {
    const q = document.createElement('span'); q.className = 'qed'; q.textContent = '∎';
    el.dlines.lastElementChild.appendChild(q);
    S.solved.add(S.li); saveSolved(); renderHead();
    el.dbtn.textContent = S.li < LEVELS.length - 1 ? '다음 문제' : '처음부터';
    el.dbtn.dataset.act = 'next';
  } else { el.dbtn.textContent = '다시'; el.dbtn.dataset.act = 'back'; }
  el.dctl.hidden = false;
  S.skip = true;
  el.dbtn.focus({ preventScroll: true });
}
el.deriv.addEventListener('click', e => {
  if (e.target.closest('.dctl')) return;
  if (!S.skip) { S.skip = true; S.cancelWait && S.cancelWait(); }
});
el.dbtn.addEventListener('click', () => {
  if (el.dbtn.dataset.act === 'next') loadLevel((S.li + 1) % LEVELS.length);
  else { el.deriv.hidden = true; S.busy = false; renderBoard(); }
});
$('eqb').addEventListener('click', solve);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.closest('button')) return;
  if (!el.deriv.hidden) { if (!el.dctl.hidden) el.dbtn.click(); else el.deriv.click(); return; }
  solve();
});
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const c = cell; computeCell(); if (c !== cell && !S.busy) render(); }, 120); });

/* ---------- boot ---------- */
let booted = false;
const mathReady = new Promise(res => { window.__mjReady = res; setTimeout(res, 6000); });
function start(data) {
  mathReady.then(() => {
    if (booted) return; booted = true;
    const li = data && Number.isInteger(data.li) ? data.li : 0;
    loadLevel(li, data && data.place);
  });
}
window.claude?.hot?.snapshot?.(() => ({ li: S.li, place: S.place }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
